<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>国标麻将 · MCR Mahjong</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='15' fill='%230d5236'/%3E%3Crect x='3.5' y='3.5' width='57' height='57' rx='13.5' fill='none' stroke='%23e3c87e' stroke-width='3'/%3E%3Crect x='11' y='22' width='19' height='28' rx='3' fill='%23e8e0cc' transform='rotate(-17 20.5 36)'/%3E%3Crect x='34' y='22' width='19' height='28' rx='3' fill='%23e8e0cc' transform='rotate(17 43.5 36)'/%3E%3Crect x='21' y='16' width='22' height='33' rx='3' fill='%23fffdf6' stroke='%23c9bb98'/%3E%3Crect x='29.5' y='19' width='5' height='27' fill='%23c8322b'/%3E%3Crect x='24' y='26.5' width='16' height='12' fill='none' stroke='%23c8322b' stroke-width='4'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <!-- ===================== main menu ===================== -->
  <section id="screen-menu" class="screen">
    <div class="menu-logo">
      <h1 data-i18n="title">国标麻将</h1>
      <p data-i18n="subtitle">中国麻将竞赛规则 · 四圈十六局</p>
      <div class="menu-tiles" id="menu-tiles"></div>
    </div>
    <div class="menu-actions">
      <button class="btn primary" id="btn-new" data-i18n="newGame">开始新游戏</button>
      <button class="btn" id="btn-continue" data-i18n="continueGame">继续游戏</button>
      <button class="btn" id="btn-career" data-i18n="career">生涯档案</button>
      <button class="btn" id="btn-manual" data-i18n="manual">胡牌手册</button>
      <button class="btn" id="btn-tutorial" data-i18n="tutorial">规则讲解</button>
      <button class="btn danger" id="btn-reset" data-i18n="resetGame">重置游戏</button>
    </div>
    <div class="menu-foot">
      <button class="btn ghost" id="btn-lang" data-i18n="lang">English</button>
      <span id="save-note"></span>
    </div>
  </section>

  <!-- ===================== game ===================== -->
  <section id="screen-game" class="screen hidden">
    <div class="topbar">
      <div class="grp">
        <button class="btn ghost" id="btn-quit" data-i18n="exitGame">返回</button>
      </div>
      <div class="grp">
        <span class="chip wind" id="chip-round"></span>
        <span class="chip" id="chip-hand"></span>
        <span class="chip" id="chip-minfan"></span>
        <span class="chip" id="chip-diff"></span>
        <span class="chip" id="chip-luck"></span>
      </div>
      <div class="spacer"></div>
      <div class="grp">
        <button class="btn" id="btn-stats" data-i18n="stats">本局统计</button>
        <button class="btn" id="btn-manual2" data-i18n="manual">胡牌手册</button>
        <button class="btn" id="btn-tutorial2" data-i18n="tutorial">规则讲解</button>
        <button class="btn ghost" id="btn-lang2" data-i18n="lang">English</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table" id="table">
        <div class="seat seat-2" id="seat-2"></div>
        <div class="seat seat-3" id="seat-3"></div>
        <div class="mid">
          <div class="discards d-2" id="disc-2"></div>
          <div class="discards d-3" id="disc-3"></div>
          <div class="info" id="info"></div>
          <div class="discards d-1" id="disc-1"></div>
          <div class="discards d-0" id="disc-0"></div>
        </div>
        <div class="seat seat-1" id="seat-1"></div>
        <div class="seat seat-0" id="seat-0"></div>
      </div>
    </div>

    <div class="hand-area">
      <div class="hint" id="hint"></div>
      <div class="my-hand" id="my-hand"></div>
      <div class="actions" id="actions"></div>
    </div>
  </section>

</div>

<div id="overlays"></div>

<script src="js/tiles.js"></script>
<script src="js/hand.js"></script>
<script src="js/fandefs.js"></script>
<script src="js/fan.js"></script>
<script src="js/i18n.js"></script>
<script src="js/tileface.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
